name: Configuration and clean-clone smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 16 * * 6"

concurrency:
  group: configuration-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  configuration-smoke:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: PELICAN_WITH_AUDIO=OFF
            id: audio
            kind: build-unit
          - name: PELICAN_WITH_VAT=OFF
            id: vat
            kind: build-unit
          - name: PELICAN_WITH_EXR=OFF
            id: exr
            kind: build-unit
          - name: PELICAN_WITH_RPC=OFF
            id: rpc
            kind: build-unit
          - name: PELICAN_WITH_SEQPLAYER=OFF
            id: seqplayer
            kind: build-unit
          - name: PELICAN_WITH_IMGUI=OFF
            id: imgui
            kind: build-unit
          - name: PELICAN_WITH_PHYSICS=OFF / provider variants
            id: physics
            kind: build-unit
          - name: PELICAN_WITH_OPENXR=OFF
            id: openxr
            kind: build-unit
          - name: PELICAN_WITH_RENDERDOC=OFF
            id: renderdoc
            kind: build-unit
          - name: PELICAN_WITH_STANDARD_RENDER_ALGORITHMS=OFF
            id: standard-render-algorithms
            kind: build-unit
          - name: PELICAN_PROJECT project-code smoke
            id: project-code
            kind: project-code

    steps:
      - name: Check out sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: true
          fetch-depth: 1

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Prepare logs
        shell: pwsh
        run: New-Item -ItemType Directory -Force "ci-artifacts/${{ matrix.id }}" | Out-Null

      - name: Run single feature-OFF smoke
        if: matrix.kind == 'build-unit'
        shell: pwsh
        run: |
          cmake `
            "-DPELICAN_BUILD_UNIT_SMOKE_ONLY=${{ matrix.id }}" `
            -DPELICAN_BUILD_UNIT_SMOKE_CONFIG=Debug `
            -DPELICAN_BUILD_UNIT_SMOKE_CLEAN_BUILDS=ON `
            -P test/run_build_units_smoke.cmake 2>&1 |
            Tee-Object -FilePath "ci-artifacts/${{ matrix.id }}/smoke.log"
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }

      - name: Run project-code smoke
        if: matrix.kind == 'project-code'
        shell: pwsh
        run: |
          cmake `
            -DPELICAN_PROJECT_CODE_SMOKE_CONFIG=Debug `
            -P test/run_project_code_smoke.cmake 2>&1 |
            Tee-Object -FilePath "ci-artifacts/${{ matrix.id }}/smoke.log"
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }

      - name: Upload configuration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: configuration-smoke-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ci-artifacts/${{ matrix.id }}/
            build-off-*/CMakeFiles/CMakeConfigureLog.yaml
            build-off-*/Testing/Temporary/LastTest.log
            build-project-example/CMakeFiles/CMakeConfigureLog.yaml
            build-project-example/Testing/Temporary/LastTest.log

  clean-clone:
    name: Fresh checkout / GPU-free CTest
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Check out sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Prepare logs
        shell: pwsh
        run: New-Item -ItemType Directory -Force build-clean-clone/ci-artifacts | Out-Null

      - name: Assert heavy example assets are absent
        shell: pwsh
        run: |
          $ignored = @(git ls-files --others --ignored --exclude-standard -- projects/example/assets)
          if ($ignored.Count -ne 0) {
            $ignored | ForEach-Object { Write-Error "unexpected ignored asset in fresh checkout: $_" }
            exit 1
          }
          "fresh checkout contains no ignored example assets" |
            Set-Content -Encoding utf8 build-clean-clone/ci-artifacts/asset-isolation.log

      - name: Test CI policy checkers
        shell: pwsh
        run: |
          python -B -m unittest discover -s test/ci -p "test_*.py" -v 2>&1 |
            Tee-Object -FilePath build-clean-clone/ci-artifacts/skip-policy-tests.log
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }

      - name: Check golden inventory
        shell: pwsh
        run: |
          python -B test/golden_inventory.py --repo-root . 2>&1 |
            Tee-Object -FilePath build-clean-clone/ci-artifacts/golden-inventory.log
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }

      - name: Configure fresh checkout
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          cmake `
            -S . `
            -B build-clean-clone `
            -DSKIP_DEVSTUDIO=ON `
            -DPELICAN_PYTHON_TESTS=ON `
            -DPELICAN_WITH_SPIRV_LINK=ON `
            "-DPython3_EXECUTABLE=$python" 2>&1 |
            Tee-Object -FilePath build-clean-clone/ci-artifacts/configure.log
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }

      - name: Build Debug
        shell: pwsh
        run: |
          cmake --build build-clean-clone --config Debug 2>&1 |
            Tee-Object -FilePath build-clean-clone/ci-artifacts/build.log
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }

      - name: Run GPU-free CTest with exact SKIP policy
        shell: pwsh
        run: >-
          python -B test/ci/run_cpu_gate.py
          --build-dir build-clean-clone
          --config Debug
          --artifacts-dir build-clean-clone/ci-artifacts

      - name: Upload clean-clone diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clean-clone-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build-clean-clone/ci-artifacts/
            build-clean-clone/Testing/Temporary/LastTest.log
            build-clean-clone/CMakeFiles/CMakeConfigureLog.yaml
