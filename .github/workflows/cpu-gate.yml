name: CPU gate

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      # Temporary: branches used to bring the hosted checks back to green.
      - "ci/**"
  workflow_dispatch:

concurrency:
  group: cpu-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows MSVC / GPU-free CTest (${{ matrix.os }})
    # windows-2022 has Visual Studio 2022; windows-latest has the newest Visual Studio. Both must build.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Check out sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Make the SDK's layers and DLLs visible; use a long temporary path
        shell: pwsh
        run: |
          # The hosted image has no installed Vulkan runtime: the validation layer and the SDK's DLLs
          # exist only inside the unpacked SDK, and a Debug build asks for the validation layer by default.
          "VK_ADD_LAYER_PATH=$env:VULKAN_SDK\Bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$env:VULKAN_SDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # The default TEMP is an 8.3 short path (RUNNER~1); tests compare it with canonical paths.
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # The runner is elevated, and an elevated process's Vulkan loader ignores VK_ADD_LAYER_PATH.
          # Register the validation layer's manifest where the loader always looks.
          $layers = "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers"
          New-Item -Path $layers -Force | Out-Null
          New-ItemProperty -Path $layers -Name "$env:VULKAN_SDK\Bin\VkLayer_khronos_validation.json" -PropertyType DWord -Value 0 -Force | Out-Null
          # Some images (windows-2022) have no Vulkan loader at all; the unpacked SDK has none either.
          if (-not (where.exe vulkan-1.dll 2>$null)) {
            $zip = Join-Path $env:RUNNER_TEMP "vulkan-runtime-components.zip"
            Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/1.4.309.0/windows/vulkan-runtime-components.zip?Human=true" -OutFile $zip
            Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "vulkan-runtime") -Force
            $loader = Get-ChildItem (Join-Path $env:RUNNER_TEMP "vulkan-runtime") -Recurse -Filter vulkan-1.dll |
              Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            if ($loader) { $loader.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append; "Vulkan loader: $($loader.FullName)" }
            else { "no vulkan-1.dll in the runtime components archive"; Get-ChildItem (Join-Path $env:RUNNER_TEMP "vulkan-runtime") -Recurse | Select-Object -First 30 FullName }
          }
          Get-ChildItem "$env:VULKAN_SDK\Bin" -Filter "VkLayer_khronos_validation*" | Select-Object Name, Length | Format-Table
          Get-ChildItem "$env:VULKAN_SDK\Bin" -Filter "*.dll" | Select-Object -First 40 Name | Format-Table
          where.exe vulkan-1.dll
          exit 0

      - name: Prepare logs
        shell: pwsh
        run: New-Item -ItemType Directory -Force build/ci-artifacts | Out-Null

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -DSKIP_DEVSTUDIO=ON `
            -DPELICAN_PYTHON_TESTS=ON `
            -DPELICAN_WITH_SPIRV_LINK=ON 2>&1 |
            Tee-Object -FilePath build/ci-artifacts/configure.log
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }

      - name: Build Debug
        shell: pwsh
        run: |
          cmake --build build --config Debug 2>&1 |
            Tee-Object -FilePath build/ci-artifacts/build.log
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }

      - name: Run GPU-free CTest with exact SKIP policy
        shell: pwsh
        run: >-
          python -B test/ci/run_cpu_gate.py
          --build-dir build
          --config Debug
          --artifacts-dir build/ci-artifacts

      - name: Name the DLL a test executable cannot find
        if: failure()
        shell: pwsh
        run: |
          # A test executable that exits with 0xc0000135 at discovery lacks a DLL; Windows does not say which.
          $exe = Get-ChildItem build -Recurse -Filter pelican_test_gp2_spawn_test.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if ($exe -and $dumpbin) {
            & $dumpbin.FullName /dependents $exe.FullName | Select-String '^\s+\S+\.dll\s*$' | ForEach-Object {
              $name = $_.ToString().Trim()
              $found = (where.exe $name 2>$null | Select-Object -First 1)
              if (-not $found -and (Test-Path (Join-Path $exe.DirectoryName $name))) { $found = "next to the executable" }
              if ($found) { "ok       $name  ($found)" } else { "MISSING  $name" }
            }
          } else { "no executable or no dumpbin: exe=$($exe.FullName) dumpbin=$($dumpbin.FullName)" }
          # crash_symbol_archive_contract: show what the archive holds (names, sizes, the manifests' bytes).
          cmake --version | Select-Object -First 1
          Get-ChildItem build -Recurse -Filter manifest.txt -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'pelican_symbol_probe' } | Select-Object -First 4 | ForEach-Object {
              "== $($_.FullName) ($($_.Length) bytes)"
              Get-Content $_.FullName -Raw | Format-Hex | Select-Object -First 12
              Get-ChildItem $_.DirectoryName | Select-Object Name, Length | Format-Table
            }
          exit 0

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-gate-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/ci-artifacts/
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml

  windows-msvc-studio:
    name: Windows MSVC / Studio offscreen
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Check out sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Make the SDK's layers and DLLs visible; use a long temporary path
        shell: pwsh
        run: |
          # The hosted image has no installed Vulkan runtime: the validation layer and the SDK's DLLs
          # exist only inside the unpacked SDK, and a Debug build asks for the validation layer by default.
          "VK_ADD_LAYER_PATH=$env:VULKAN_SDK\Bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$env:VULKAN_SDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # The default TEMP is an 8.3 short path (RUNNER~1); tests compare it with canonical paths.
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # The runner is elevated, and an elevated process's Vulkan loader ignores VK_ADD_LAYER_PATH.
          # Register the validation layer's manifest where the loader always looks.
          $layers = "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers"
          New-Item -Path $layers -Force | Out-Null
          New-ItemProperty -Path $layers -Name "$env:VULKAN_SDK\Bin\VkLayer_khronos_validation.json" -PropertyType DWord -Value 0 -Force | Out-Null
          # Some images (windows-2022) have no Vulkan loader at all; the unpacked SDK has none either.
          if (-not (where.exe vulkan-1.dll 2>$null)) {
            $zip = Join-Path $env:RUNNER_TEMP "vulkan-runtime-components.zip"
            Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/1.4.309.0/windows/vulkan-runtime-components.zip?Human=true" -OutFile $zip
            Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "vulkan-runtime") -Force
            $loader = Get-ChildItem (Join-Path $env:RUNNER_TEMP "vulkan-runtime") -Recurse -Filter vulkan-1.dll |
              Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            if ($loader) { $loader.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append; "Vulkan loader: $($loader.FullName)" }
            else { "no vulkan-1.dll in the runtime components archive"; Get-ChildItem (Join-Path $env:RUNNER_TEMP "vulkan-runtime") -Recurse | Select-Object -First 30 FullName }
          }
          Get-ChildItem "$env:VULKAN_SDK\Bin" -Filter "VkLayer_khronos_validation*" | Select-Object Name, Length | Format-Table
          Get-ChildItem "$env:VULKAN_SDK\Bin" -Filter "*.dll" | Select-Object -First 40 Name | Format-Table
          where.exe vulkan-1.dll
          exit 0

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.10.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Prepare Studio logs
        shell: pwsh
        run: New-Item -ItemType Directory -Force build-studio/ci-artifacts | Out-Null

      - name: Configure Studio with compiler OFF
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build-studio `
            -DSKIP_DEVSTUDIO=OFF `
            -DPELICAN_RUNTIME_SHADER_COMPILER=OFF `
            -DPELICAN_WITH_SPIRV_LINK=OFF `
            -DPELICAN_PYTHON_TESTS=OFF 2>&1 |
            Tee-Object -FilePath build-studio/ci-artifacts/configure.log
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }

      - name: Build Studio CPU suite and RT1a tests
        shell: pwsh
        run: |
          cmake --build build-studio --config Debug --target `
            pelican_studio_cpu_tests `
            pelican_test_raytracing_rt1a_test 2>&1 |
            Tee-Object -FilePath build-studio/ci-artifacts/build.log
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }

      - name: Run Studio offscreen with exact SKIP policy
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -B test/ci/run_studio_gate.py `
            --build-dir build-studio --config Debug `
            --artifacts-dir build-studio/ci-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run WP364 RT1a with compiler and SPIRV_LINK off
        shell: pwsh
        run: |
          & build-studio/test/Debug/pelican_test_raytracing_rt1a_test.exe `
            --reporter console 2>&1 |
            Tee-Object -FilePath build-studio/ci-artifacts/rt1a.log
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }

      - name: Upload Studio diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-gate-studio-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build-studio/ci-artifacts/
            build-studio/Testing/Temporary/LastTest.log
            build-studio/CMakeFiles/CMakeConfigureLog.yaml
