name: CPU gate

on:
  pull_request:
  push:
    branches:
      - develop
      - main

concurrency:
  group: cpu-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows MSVC / GPU-free CTest
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Check out sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Prepare logs
        shell: pwsh
        run: New-Item -ItemType Directory -Force build/ci-artifacts | Out-Null

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -DSKIP_DEVSTUDIO=ON `
            -DPELICAN_PYTHON_TESTS=ON `
            -DPELICAN_WITH_SPIRV_LINK=ON 2>&1 |
            Tee-Object -FilePath build/ci-artifacts/configure.log
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }

      - name: Build Debug
        shell: pwsh
        run: |
          cmake --build build --config Debug 2>&1 |
            Tee-Object -FilePath build/ci-artifacts/build.log
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }

      - name: Run GPU-free CTest with exact SKIP policy
        shell: pwsh
        run: >-
          python -B test/ci/run_cpu_gate.py
          --build-dir build
          --config Debug
          --artifacts-dir build/ci-artifacts

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-gate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/ci-artifacts/
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml

  windows-msvc-studio:
    name: Windows MSVC / Studio offscreen
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Check out sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.10.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Prepare Studio logs
        shell: pwsh
        run: New-Item -ItemType Directory -Force build-studio/ci-artifacts | Out-Null

      - name: Configure Studio with compiler OFF
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build-studio `
            -DSKIP_DEVSTUDIO=OFF `
            -DPELICAN_RUNTIME_SHADER_COMPILER=OFF `
            -DPELICAN_WITH_SPIRV_LINK=OFF `
            -DPELICAN_PYTHON_TESTS=OFF 2>&1 |
            Tee-Object -FilePath build-studio/ci-artifacts/configure.log
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }

      - name: Build Studio CPU suite and RT1a tests
        shell: pwsh
        run: |
          cmake --build build-studio --config Debug --target `
            pelican_studio_cpu_tests `
            pelican_test_raytracing_rt1a_test 2>&1 |
            Tee-Object -FilePath build-studio/ci-artifacts/build.log
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }

      - name: Run Studio offscreen with exact SKIP policy
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -B test/ci/run_studio_gate.py `
            --build-dir build-studio --config Debug `
            --artifacts-dir build-studio/ci-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run WP364 RT1a with compiler and SPIRV_LINK off
        shell: pwsh
        run: |
          & build-studio/test/Debug/pelican_test_raytracing_rt1a_test.exe `
            --reporter console 2>&1 |
            Tee-Object -FilePath build-studio/ci-artifacts/rt1a.log
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }

      - name: Upload Studio diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-gate-studio-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build-studio/ci-artifacts/
            build-studio/Testing/Temporary/LastTest.log
            build-studio/CMakeFiles/CMakeConfigureLog.yaml
